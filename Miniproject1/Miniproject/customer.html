<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map My Vendor - Customer Mode (Ballari)</title>

    <script>const currentRole = 'customer';</script>

    <style>
        :root {
            --primary-green: #388e3c;
            --secondary-blue: #1976d2;
            --bg-light: #f4f7f6;
            --text-dark: #333;
            --card-bg: #fff;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        #map {
            flex-grow: 1;
            height: 100%;
            background: #e0e0e0
        }

        #sidebar {
            width: 350px;
            height: 100vh;
            background: var(--card-bg);
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .google-button {
            padding: 10px;
            border-radius: 4px;
            border: none;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            background: var(--secondary-blue);
            width: 100%;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .google-button:hover {
            opacity: 0.95
        }

        input[type="text"],
        input[type="tel"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 5px 0 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .auth-form {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .switch-btn {
            margin-top: 10px;
            background: none;
            border: none;
            color: var(--secondary-blue);
            cursor: pointer;
            font-size: .9em;
            text-decoration: underline
        }

        .switch-btn:hover {
            color: var(--primary-green)
        }

        .input-error {
            border: 2px solid red !important
        }

        p.error-msg {
            color: red;
            font-size: 12px;
            margin: -6px 0 10px 0;
            min-height: 16px
        }

        @media (max-width:850px) {
            body {
                flex-direction: column;
                overflow-y: auto
            }

            #map {
                width: 100%;
                height: 50vh
            }

            #sidebar {
                width: 100%;
                height: 50vh;
                box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.1);
                overflow-y: scroll
            }
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <div id="sidebar">
        <h2>Customer Mode</h2>
        <div id="userStatus" style="margin-bottom:15px;font-weight:bold;color:var(--secondary-blue);">Welcome! Please
            log in.</div>

        <div id="loginPanel">
            <h3>Welcome to Map My Vendor</h3>
            <p id="authMessage" style="font-size:.9em;margin-bottom:20px;color:var(--secondary-blue);">Please Register
                or Log In to continue.</p>

            <!-- Register -->
            <div id="registerForm" class="auth-form">
                <input type="text" id="registerName" placeholder="Your Name" required />
                <p id="registerNameError" class="error-msg"></p>

                <input type="tel" id="registerPhone" placeholder="Phone Number (as ID)" required />
                <p id="registerPhoneError" class="error-msg"></p>

                <input type="password" id="registerPassword" placeholder="Password (Digits Only)" pattern="\d+"
                    title="Password must be digits only" required />
                <p id="registerPasswordError" class="error-msg"></p>

                <button id="btnRegister" class="google-button" style="background-color:var(--primary-green);"
                    disabled>Register</button>
                <button id="switchToLogin" class="switch-btn">Already have an account? Log In</button>
            </div>

            <!-- Login -->
            <div id="loginForm" class="auth-form" style="display:none;">
                <input type="tel" id="loginPhone" placeholder="Phone Number" required />
                <p id="loginPhoneError" class="error-msg"></p>

                <input type="password" id="loginPassword" placeholder="Password" required />
                <p id="loginPasswordError" class="error-msg"></p>

                <button id="btnLogin" class="google-button" disabled>Log In</button>
                <button id="switchToRegister" class="switch-btn">New user? Register</button>
            </div>
        </div>

        <div id="customerControls" style="display:none;">
            <div class="form-group">
                <h4>Find Vendors Near You</h4>
                <input type="text" id="itemSearch" placeholder="Search for Item (e.g., Potato) or Vendor Name">
                <button id="btnSearch" class="google-button" style="background-color:var(--primary-green);">Search
                    Vendors</button>
                <div id="searchStatus" style="font-size:12px;color:#666"></div>
            </div>

            <div id="vendorDetails" style="display:none;">
                <h4>Selected Vendor</h4>
                <div id="vendorName" style="font-weight:bold;font-size:1.1em;color:var(--text-dark)"></div>
                <div id="vendorPhone" style="font-size:.9em;margin-top:5px;color:#666"></div>
                <div style="font-size:.9em;margin-top:10px;">**Menu:** <span id="vendorMenu"
                        style="font-weight:500"></span></div>

                <hr style="margin:15px 0;">

                <button id="btnAlert" class="google-button">Set 150m Alert</button>
                <button id="btnSendRequest" class="google-button">Send Visit Request</button>
                <button id="btnSendFeedback" class="google-button" style="background-color:#5cb85c;margin-top:10px;">⭐
                    Send Feedback</button>
            </div>
        </div>
    </div>

    <!-- your external scripts -->
    <script src="script.js"></script>
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
    <script
        src="https://maps.googleapis.com/maps/api/js?key="KEY HERE" &loading=async&callback=initMap&libraries=marker"></script>

    <!-- Validation script (name + strict Indian phone) -->
    <script>
        (function () {
            // Utility validators
            function isValidName(v) {
                // allow letters and spaces, at least 1 letter
                return /^[A-Za-z\s]+$/.test(v.trim());
            }
            function formatPhone(v) {
                // strip non-digits and limit to 10
                const digits = v.replace(/\D/g, '').slice(0, 10);
                return digits;
            }
            function isValidPhone(v) {
                return /^[6-9]\d{9}$/.test(v);
            }

            // Elements (register)
            const registerName = document.getElementById('registerName');
            const registerPhone = document.getElementById('registerPhone');
            const registerPassword = document.getElementById('registerPassword');
            const btnRegister = document.getElementById('btnRegister');

            const regNameErr = document.getElementById('registerNameError');
            const regPhoneErr = document.getElementById('registerPhoneError');
            const regPassErr = document.getElementById('registerPasswordError');

            // Elements (login)
            const loginPhone = document.getElementById('loginPhone');
            const loginPassword = document.getElementById('loginPassword');
            const btnLogin = document.getElementById('btnLogin');

            const loginPhoneErr = document.getElementById('loginPhoneError');
            const loginPassErr = document.getElementById('loginPasswordError');

            // Validate register name
            registerName.addEventListener('input', function () {
                const v = registerName.value;
                if (v.trim() === '') {
                    regNameErr.textContent = '';
                    registerName.classList.remove('input-error');
                } else if (!isValidName(v)) {
                    regNameErr.textContent = 'Name should contain letters and spaces only.';
                    registerName.classList.add('input-error');
                } else {
                    regNameErr.textContent = '';
                    registerName.classList.remove('input-error');
                }
                updateRegisterButtonState();
            });

            // Validate and format register phone
            registerPhone.addEventListener('input', function () {
                const formatted = formatPhone(registerPhone.value);
                if (registerPhone.value !== formatted) registerPhone.value = formatted;
                if (registerPhone.value.length === 0) {
                    regPhoneErr.textContent = '';
                    registerPhone.classList.remove('input-error');
                } else if (!/^[6-9]/.test(registerPhone.value)) {
                    regPhoneErr.textContent = 'Phone number must start with 6, 7, 8, or 9.';
                    registerPhone.classList.add('input-error');
                } else if (registerPhone.value.length < 10) {
                    regPhoneErr.textContent = 'Phone number must be exactly 10 digits.';
                    registerPhone.classList.add('input-error');
                } else {
                    regPhoneErr.textContent = '';
                    registerPhone.classList.remove('input-error');
                }
                updateRegisterButtonState();
            });

            // Password presence check
            registerPassword.addEventListener('input', function () {
                if (registerPassword.value.trim() === '') {
                    regPassErr.textContent = '';
                    registerPassword.classList.remove('input-error');
                } else {
                    regPassErr.textContent = '';
                    registerPassword.classList.remove('input-error');
                }
                updateRegisterButtonState();
            });

            // Login phone validation
            loginPhone.addEventListener('input', function () {
                const formatted = formatPhone(loginPhone.value);
                if (loginPhone.value !== formatted) loginPhone.value = formatted;
                if (loginPhone.value.length === 0) {
                    loginPhoneErr.textContent = '';
                    loginPhone.classList.remove('input-error');
                } else if (!/^[6-9]/.test(loginPhone.value)) {
                    loginPhoneErr.textContent = 'Phone number must start with 6, 7, 8, or 9.';
                    loginPhone.classList.add('input-error');
                } else if (loginPhone.value.length < 10) {
                    loginPhoneErr.textContent = 'Phone number must be exactly 10 digits.';
                    loginPhone.classList.add('input-error');
                } else {
                    loginPhoneErr.textContent = '';
                    loginPhone.classList.remove('input-error');
                }
                updateLoginButtonState();
            });

            loginPassword.addEventListener('input', function () {
                if (loginPassword.value.trim() === '') {
                    loginPassErr.textContent = '';
                    loginPassword.classList.remove('input-error');
                } else {
                    loginPassErr.textContent = '';
                    loginPassword.classList.remove('input-error');
                }
                updateLoginButtonState();
            });

            // Enable/disable buttons based on validations
            function updateRegisterButtonState() {
                const nameOk = isValidName(registerName.value.trim());
                const phoneOk = isValidPhone(registerPhone.value);
                const passOk = registerPassword.value.trim().length > 0; // leave password rule to your pattern if you want stronger
                btnRegister.disabled = !(nameOk && phoneOk && passOk);
            }
            function updateLoginButtonState() {
                const phoneOk = isValidPhone(loginPhone.value);
                const passOk = loginPassword.value.trim().length > 0;
                btnLogin.disabled = !(phoneOk && passOk);
            }

            // Initial call
            updateRegisterButtonState();
            updateLoginButtonState();

            // Optionally, intercept clicks to stop further action if still invalid (safe guard)
            btnRegister.addEventListener('click', function (e) {
                if (btnRegister.disabled) {
                    e.preventDefault();
                    // small visual cue
                    if (!isValidName(registerName.value.trim())) registerName.classList.add('input-error');
                    if (!isValidPhone(registerPhone.value)) registerPhone.classList.add('input-error');
                    if (registerPassword.value.trim() === '') registerPassword.classList.add('input-error');
                } else {
                    // proceed as normal — your script.js can handle registration
                }
            });

            btnLogin.addEventListener('click', function (e) {
                if (btnLogin.disabled) {
                    e.preventDefault();
                    if (!isValidPhone(loginPhone.value)) loginPhone.classList.add('input-error');
                    if (loginPassword.value.trim() === '') loginPassword.classList.add('input-error');
                } else {
                    // proceed as normal — your script.js can handle login
                }
            });

            // Switch view buttons (preserve your UX)
            document.getElementById('switchToLogin').addEventListener('click', function () {
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('loginForm').style.display = 'block';
            });
            document.getElementById('switchToRegister').addEventListener('click', function () {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
            });
        })();
    </script>
</body>

</html>
